[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2plan"
version = "0.1.0"
description = "Dimensioned floor plans and damage evidence from depth captures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Deliberately small. A multi-gigabyte monocular depth model or a COLMAP/SfM
# stack would break installation on a clean machine, which is a property this
# project is assessed on. See README "Limitations and trade-offs".
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Everything needed to reproduce the benchmark and the test suite. Kept out of
# the core install so `pip install scan2plan` stays light.
analysis = [
    "matplotlib>=3.7",
    "pytest>=7.4",
]

# Monocular depth from photos and video (see scan2plan.monodepth). ONNX Runtime
# rather than PyTorch: this is a CPU-only path, the runtime is ~15 MB against a
# multi-gigabyte torch install, and it keeps the core dependency set untouched.
# The 99 MB model itself is downloaded separately, not installed.
depth = [
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]

# Linting. Not part of the runtime install: this is a development-time gate,
# and it runs in well under a second.
dev = [
    "ruff>=0.16",
]

[project.scripts]
scan2plan-plan = "scan2plan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 120 rather than ruff's default 88. The long lines this admits are data-formatting
# and HTML/CSS strings in the diagnostic scripts and the SVG writer, where wrapping
# hurts readability more than it helps. The longest line in src/scan2plan is 106
# characters (report.py, segment.py); nothing exceeds 120.
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# E/F/W are correctness. B catches the closure-over-loop-variable and
# zip-truncation classes, which are silent-wrong-answer bugs rather than style.
# ARG is off in tests because deliberately-unused parameters are how test helpers
# document the signature they are standing in for.
select = ["E", "F", "W", "B", "SIM", "UP", "C4", "RET"]

# "%d" formatting is used deliberately where an f-string would be longer and
# less readable; printf-style is not a correctness issue.
ignore = [
    "UP031",   # "%d" formatting is used deliberately where an f-string is longer
    "SIM108",  # the suggested ternary at monodepth.py:155 is a 130-character line,
               # so the "fix" is strictly less readable than the if/else it replaces
]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests deliberately adjust sys.path before importing, so the import
# block is genuinely not at the top of the file.
"scripts/*" = ["E402"]
"tests/*" = ["E402", "ARG001", "F401"]
