[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2plan"
version = "0.1.0"
description = "Dimensioned floor plans and damage evidence from depth captures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Deliberately small. A multi-gigabyte monocular depth model or a COLMAP/SfM
# stack would break installation on a clean machine, which is a property this
# project is assessed on. See README "Limitations and trade-offs".
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Everything needed to reproduce the benchmark and the test suite. Kept out of
# the core install so `pip install scan2plan` stays light.
analysis = [
    "matplotlib>=3.7",
    "pytest>=7.4",
]

# Monocular depth from photos and video (see scan2plan.monodepth). ONNX Runtime
# rather than PyTorch: this is a CPU-only path, the runtime is ~15 MB against a
# multi-gigabyte torch install, and it keeps the core dependency set untouched.
# The 99 MB model itself is downloaded separately, not installed.
depth = [
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]

[project.scripts]
scan2plan-plan = "scan2plan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
